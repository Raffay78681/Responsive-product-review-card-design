<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto card preview page</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/favicon-32x32.png" />
  </head>
  <body>
    <main>
      <div class="card">
        <div class="nft-img-wrapper">
          <img src="images/image-equilibrium.jpg" alt="" class="nft-image" />
          <a class="overlay" href="#">
            <img src="images/icon-view.svg" alt="" class="eye-icon" />
          </a>
        </div>
        <a href="#" class="heading-wrapper">
          <h1 class="nft-name">Equilibrium #3429</h1>
        </a>
        <p class="nft-description">
          Our Equilibrium collection promotes balance and calm.
        </p>
        <div class="eth-info">
          <div class="value-wrapper">
            <img src="images/icon-ethereum.svg" alt="" class="eth-icon" />
            <p class="value">0.041 ETH</p>
          </div>
          <div class="time-wrapper">
            <img src="images/icon-clock.svg" alt="" class="time-icon" />
            <p class="time-left">3 days left</p>
          </div>
        </div>
        <hr />
        <div class="creator-info">
          <img
            src="images/image-avatar.png"
            alt="Jules Wyvern"
            class="creator-img"
          />
          <p class="creation-of">
            Creation of <a href="#" class="creator-name">Jules Wyvern</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
